<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="neo-container">
        <h2>Welcome Back</h2>
        <div id="error-message"></div>
        <form id="login-form">
            <input type="email" id="email" class="neo-input" placeholder="Email Address" required>
            <input type="password" id="password" class="neo-input" placeholder="Password" required>
            <button type="submit" id="login-btn" class="neo-button">Login</button>
        </form>
        <p style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">
            Don't have an account? 
            <a href="register.html" style="color: var(--text-color); font-weight: bold; text-decoration: none;">Register here</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
