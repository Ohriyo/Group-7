<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="neo-container">
        <h2>Create Account</h2>
        <div id="error-message"></div>
        <div id="success-message" style="color: #28a745; background: rgba(40, 167, 69, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; display: none;"></div>
        
        <form id="register-form">
            <input type="text" id="name" class="neo-input" placeholder="Full Name" required>
            <input type="email" id="email" class="neo-input" placeholder="Email Address" required>
            <input type="password" id="password" class="neo-input" placeholder="Password" required>
            <button type="submit" id="register-btn" class="neo-button">Sign Up</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">
            Already have an account? 
            <a href="login.html" style="color: var(--text-color); font-weight: bold; text-decoration: none;">Login here</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
